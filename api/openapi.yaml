openapi: 3.0.3
info:
  title: BeeBase Media Service API
  description: >
    Reusable file/media upload service for BeeBase, an open-source backend
    for a beekeeper management application split into microservices.
    Access tokens are issued by auth-service (see its OpenAPI spec); this
    service verifies them against auth-service's public key and never
    trusts a userID from anywhere but a verified token.

    A file (photo, PDF, XML, or other document) is uploaded on its own,
    owned only by the caller. This service has no notion of an owning
    apiary or hive at all - it never queries, verifies, or even knows
    those exist. Which apiary/hive (if any) a media id is associated with
    is tracked entirely by apiary-service/hive-service themselves, in
    their own `images` field; this service's only job is storing files
    and handing them back by id, scoped to whoever uploaded them. A
    client extracts the ids it cares about from an apiary/hive response
    and passes them to GET /api/v1/media?ids= to resolve them.

    Storage note (MVP): file bytes are stored directly in PostgreSQL,
    gzip-compressed where that helps, rather than in a separate object
    store. GET .../download is the stable, authenticated URL a client
    fetches or displays a file from; there's no public/unauthenticated
    URL, and no separate object-storage credential to manage.
  version: 0.1.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: media
    description: Upload, retrieve, download, list, and delete files.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      description: Always returns 200 while the process is running. Has no dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      security: []
      description: Returns 200 only if the database is reachable.
      responses:
        "200":
          description: The service is ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/media:
    post:
      tags: [media]
      summary: Upload a file, owned by the caller
      description: >
        multipart/form-data. No apiary or hive needs to exist yet - upload
        is entirely standalone. Once you have the returned id, reference
        it in `images` on `POST`/`PUT /apiaries` or `/hives` (see those
        services' own OpenAPI specs) to associate it with one. The server
        never trusts the client's declared file type: the extension is
        checked against an allowlist and, where reliably sniffable,
        cross-checked against the file's actual bytes.

        media_id is an optional client-generated idempotency key: retrying
        the same upload (e.g. after a network failure) with the same
        media_id returns the already-stored file (200) instead of creating
        a duplicate (201). Reusing an ID that belongs to a different
        user's upload is rejected with 409 media_id_conflict.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/UploadMediaRequest" }
      responses:
        "201":
          description: File uploaded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResponse" }
        "200":
          description: Idempotent replay of a previous upload (same media_id, same caller).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResponse" }
        "400":
          description: Request failed validation (malformed media_id, or no file part).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: media_id already belongs to a different user's upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "413":
          description: The file exceeds the configured maximum upload size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "415":
          description: Unrecognized file extension, or its content doesn't match what the extension implies.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [media]
      summary: Get the authenticated user's files by id
      description: >
        Returns only files owned by the caller among the given ids - never
        another user's. `ids` is the only filter this endpoint accepts (no
        page/limit): a client that wants "every photo attached to this
        apiary/hive" gets the id list from the apiary/hive's own `images`
        field and passes it here.

        An id that doesn't exist, is already deleted, or belongs to a
        different user is simply absent from the result - never an error.
        Duplicate ids collapse to one result. An empty (or omitted) `ids`
        returns an empty list. Where technically possible, results are
        returned in the same order as the (de-duplicated) requested ids.
        At most 100 distinct ids may be requested at once.
      parameters:
        - name: ids
          in: query
          description: Repeat to request multiple ids, e.g. ?ids=<id1>&ids=<id2>.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        "200":
          description: The caller's files among the requested ids.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MediaResponse" }
        "400":
          description: An id is not a valid UUID, or more than 100 distinct ids were requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [media]
      summary: Bulk-delete files by id
      description: >
        **Internal only** - beebase-gateway blocks this exact method+path
        from every external caller (a 404, indistinguishable from a route
        that doesn't exist), so it is never reachable from outside the
        cluster. It exists purely as a service-to-service call:
        apiary-service and hive-service call it directly against
        media-service (bypassing the gateway) when an apiary/hive is
        itself being deleted, to hard-delete every media id it knows it
        references (its own `images`). Documented here because it's still
        a real, load-bearing part of media-service's HTTP surface those
        services depend on, even though no external client can or should
        call it directly.

        Same `ids` semantics as the GET above (repeat the query param,
        scoped to the caller, at most 100 distinct ids). An id that
        doesn't exist, was already deleted, or belongs to a different
        user is simply not counted - a zero count is a normal outcome,
        not an error, so this is always safe to retry.
      parameters:
        - name: ids
          in: query
          description: Repeat to request multiple ids, e.g. ?ids=<id1>&ids=<id2>.
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        "204":
          description: Every requested id belonging to the caller is now deleted (or already was).
        "400":
          description: An id is not a valid UUID, or more than 100 distinct ids were requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [media]
      summary: Get one of the authenticated user's files' metadata
      description: >
        Returns 404 both when mediaId doesn't exist and when it belongs to
        a different user - the two cases are indistinguishable to the
        caller, by design.
      responses:
        "200":
          description: The file's metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaResponse" }
        "400":
          description: mediaId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such file, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [media]
      summary: Delete a file
      description: >
        The metadata row is soft-deleted (deleted_at is set) for future
        sync support, and the stored file content is removed immediately.
      responses:
        "204":
          description: The file is deleted (or already was).
        "400":
          description: mediaId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such file, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/media/{mediaId}/download:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [media]
      summary: Download a file's content
      description: >
        The stable, authenticated URL a client fetches or displays a file
        from. Content-Type reflects the stored canonical MIME type, and
        Content-Disposition suggests the original filename.
      responses:
        "200":
          description: The file's raw content.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400":
          description: mediaId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such file, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by auth-service's /api/v1/auth/login (or /register or /refresh).

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    UploadMediaRequest:
      type: object
      required: [file]
      properties:
        media_id:
          type: string
          format: uuid
          description: Optional client-generated idempotency key for safely retrying a failed upload.
        file:
          type: string
          format: binary

    MediaResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        original_filename: { type: string }
        content_type: { type: string, example: image/jpeg }
        size_bytes: { type: integer, format: int64 }
        status: { type: string, enum: [available] }
        image_url:
          type: string
          format: uri
          description: >
            The authenticated URL to fetch or display this item's
            content from - always GET /media/{id}/download (this same
            service, reverse-proxied by the gateway), built fresh on
            every response from PUBLIC_BASE_URL. Prefer this field over
            constructing the download URL from id yourself.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - media_not_found
                - invalid_media_id
                - unsupported_file_type
                - file_too_large
                - media_id_conflict
                - file_required
                - missing_authorization
                - invalid_access_token
                - invalid_body
                - internal_error
              example: media_not_found
            message: { type: string, example: media not found }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: >
                Field name to error code. Each value is a stable key (not a
                human-readable message) meant to be localized client-side.
              additionalProperties:
                type: string
                enum:
                  - media_id_invalid
                  - ids_invalid
                  - ids_too_many
              example: { ids: "ids_invalid" }
